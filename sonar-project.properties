# Sonar organization (required)
sonar.organization=luisphernandez
# Sonar project Key (required)
sonar.projectKey=luisphernandez_market
# Sonar projectName. The name that appears on the Sonar dashboard (required)
sonar.projectName=Market
sonar.projectVersion=0.0.1

# Código fuente y tests, por separado
sonar.sources=src/main/java
sonar.tests=src/test/java

# Carpetas donde Eclipse/Maven compilan el código y los tests
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

sonar.language=java
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=ISO-8859-1

# Cobertura: informe XML exportado desde EclEmma
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=coverage.xml
